services:
    nginx:
        image: nginx:alpine
        ports:
            - "8090:80"
            - "8443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
    llm:
        platform: linux/amd64
        image: vllm/vllm-openai:v0.32.0
        container_name: llm
        expose:
            - "8000"
        environment:
            - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
            - HUGGING_FACE_CACHE_DIR=${HUGGING_FACE_CACHE_DIR}
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          device_ids: ["0"]
                          capabilities: [gpu]
        ipc: host
        volumes:
            - ${HUGGING_FACE_CACHE_DIR}:/root/.cache/huggingface
        command: >
            Qwen/Qwen3-32B-AWQ
            --port 8000
            --max-model-len 9000
            --max-num-seqs 1
            --kv-cache-dtype fp8
            --gpu-memory-utilization 0.85
            --enable-auto-tool-choice
            --tool-call-parser hermes
            --tensor-parallel-size 1
            --reasoning-parser qwen3
            --uvicorn-log-level warning
            --disable-log-requests
    faster_whisper:
        image: quay.io/ktbs/fd-itbs/faster-whisper:v1.4.1
        ports:
            - "${WHISPER_PORT}:50001"
        environment:
            - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
        deploy:
            resources:
                reservations:
                    memory: 16g
                    devices:
                        - driver: nvidia
                          device_ids: ["1"]
                          capabilities: [gpu]
    vllm-glm-ocr:
        platform: linux/amd64
        image: vllm/vllm-openai:v0.32.0
        container_name: vllm-glm-ocr
        expose:
            - "8000"
        environment:
            - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
            - LD_LIBRARY_PATH=/lib/x86_64-linux-gnu
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          device_ids: ["1"]
                          capabilities: [gpu]
        ipc: host
        volumes:
            - ${HUGGING_FACE_CACHE_DIR}:/root/.cache/huggingface
        # Shares GPU 1 with faster_whisper and docling, so cap vLLM's memory share
        command: >
            --model zai-org/GLM-OCR
            --served-model-name zai-org/GLM-OCR
            --port 8000
            --trust-remote-code
            --max-num-batched-tokens 8192
            --gpu-memory-utilization 0.3
        healthcheck:
            test:
                ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 180s
    docling:
        image: ghcr.io/dcc-bs/dcc-docling-serve-cu130:latest
        container_name: docling
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          device_ids: ["1"]
                          capabilities: [gpu]
        ports:
            - "${DOCLING_PORT}:5001"
        environment:
            - DOCLING_SERVE_ENABLE_UI=true
            - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true
            - DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS=true
            - DOCLING_SERVE_ALLOW_CUSTOM_LAYOUT_CONFIG=true
            - 'DOCLING_SERVE_CUSTOM_LAYOUT_PRESETS={"ppdoclayout-v3": {"kind": "ppdoclayout-v3"}}'
            - GLMOCR_REMOTE_OCR_API_URL=http://vllm-glm-ocr:8000/v1/chat/completions
    translator-backend:
        image: ghcr.io/dcc-bs/bs-translator-backend:latest
        expose:
            - "8000"
        environment:
            - IS_PROD=${IS_PROD}
            - LOG_LEVEL=${LOG_LEVEL}
            - PORT=8000
            - CLIENT_URL=${CLIENT_URL}
            - HMAC_SECRET=${HMAC_SECRET}
            - LLM_URL=${LLM_URL}
            - LLM_API_KEY=${LLM_API_KEY}
            - LLM_MODEL=${LLM_MODEL}
            - LLM_HEALTH_CHECK_URL=${LLM_HEALTH_CHECK_URL}
            - DOCLING_URL=${DOCLING_URL}
            - DOCLING_API_KEY=${DOCLING_API_KEY}
            - WHISPER_URL=${WHISPER_URL}
            # Keep in sync with client_max_body_size in nginx.conf
            - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB}
            - DOCLING_IMAGE_OCR_PRESET=${DOCLING_IMAGE_OCR_PRESET}
            - DOCLING_IMAGE_LAYOUT_PRESET=${DOCLING_IMAGE_LAYOUT_PRESET}
            - IMAGE_TRANSLATION_CONCURRENCY=${IMAGE_TRANSLATION_CONCURRENCY}
            # Optional tuning, passed through only when set (backend defaults otherwise)
            - LLM_REASONING
            - LLM_TIMEOUT
            - LLM_MAX_RETRIES
            - DOCLING_POLL_INTERVAL
            - DOCLING_TASK_TIMEOUT
    translator-frontend:
        container_name: translator-frontend
        build:
            context: ..
            dockerfile: ./Dockerfile
            args:
                USE_FEEDBACK: ${USE_FEEDBACK}
                LOGGER_LAYER_URI: ${LOGGER_LAYER_URI}
        environment:
            - NUXT_API_URL=http://translator-backend:8000
            - PORT=3000
            - LOG_LEVEL=${LOG_LEVEL}
            - NUXT_PUBLIC_APP_CONFIG_APP_LIST_URL_TEMPLATE=${NUXT_PUBLIC_APP_CONFIG_APP_LIST_URL_TEMPLATE}
            # Only required when the image is built with USE_FEEDBACK=true
            - NUXT_FEEDBACK_GITHUB_TOKEN
        expose:
            - 3000
