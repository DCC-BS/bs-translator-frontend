events {
    worker_connections 1024;
}

http {
    # Increase buffer sizes for large headers/cookies
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;

    # The backend rejects uploads above MAX_UPLOAD_SIZE_MB (50 MB) with a JSON 413;
    # the extra headroom covers the multipart encoding overhead.
    client_max_body_size 55M;

    # Docker's embedded DNS. Together with the variable in proxy_pass, the upstream
    # is resolved per request, so nginx starts even while the frontend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Frontend proxy
    server {
        listen 80;
        server_name localhost;

        set $frontend http://translator-frontend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Increase proxy buffer sizes for large headers
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 16k;

        # The backend sends nothing until docling finishes (up to 600 s) or a queued
        # LLM request produces its first token
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # Same shape as the backend's errors, so the client shows "file too large"
        error_page 413 @file_too_large;

        location / {
            proxy_pass $frontend;
        }

        # Streaming responses (text translation, live transcription): pass each
        # chunk through immediately instead of buffering the whole response
        location ~ ^/api/(translate|transcribe)/ {
            proxy_pass $frontend;
            proxy_buffering off;
        }

        location @file_too_large {
            default_type application/json;
            return 413 '{"errorId":"file_too_large","status":413}';
        }
    }
}
