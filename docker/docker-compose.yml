networks:
    translator-network:
        driver: bridge

services:
    nginx:
        extends:
            file: ./services.compose.yml
            service: nginx
        depends_on:
            - translator-frontend
        networks:
            - translator-network

    llm:
        extends:
            file: ./services.compose.yml
            service: llm
        networks:
            - translator-network

    faster_whisper:
        extends:
            file: ./services.compose.yml
            service: faster_whisper
        networks:
            - translator-network

    vllm-glm-ocr:
        extends:
            file: ./services.compose.yml
            service: vllm-glm-ocr
        networks:
            - translator-network

    docling:
        extends:
            file: ./services.compose.yml
            service: docling
        depends_on:
            vllm-glm-ocr:
                condition: service_healthy
        networks:
            - translator-network

    translator-backend:
        extends:
            file: ./services.compose.yml
            service: translator-backend
        networks:
            - translator-network

    translator-frontend:
        extends:
            file: ./services.compose.yml
            service: translator-frontend
        networks:
            - translator-network
